[project]
name = "accessmatrix"
version = "0.1.0"
description = "Local-first API authorization regression testing platform."
readme = "README.md"
authors = [
    { name = "Ubaid Ahmad Bhat" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "openapi-spec-validator>=0.9.0",
    "platformdirs>=4.3",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.32",
    "rich>=13.9",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2.0.51",
    "typer>=0.15",
    "uvicorn>=0.34",
]

[project.scripts]
accessmatrix = "accessmatrix.cli.app:app"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accessmatrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=accessmatrix",
    "--cov-report=term-missing",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true